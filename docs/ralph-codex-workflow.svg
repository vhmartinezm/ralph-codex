<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f3ea" />
      <stop offset="100%" stop-color="#e4f2ef" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 H 0 V 60" fill="none" stroke="#0f172a" stroke-opacity="0.05" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#0f766e" />
    </marker>
    <style>
      .title { font: 700 30px "Space Grotesk", "IBM Plex Sans", "Fira Sans", Arial, sans-serif; fill: #0f172a; letter-spacing: 0.2px; }
      .subtitle { font: 14px "IBM Plex Sans", "Fira Sans", Arial, sans-serif; fill: #475569; }
      .label { font: 600 17px "IBM Plex Sans", "Fira Sans", Arial, sans-serif; fill: #111827; }
      .small { font: 13px "IBM Plex Sans", "Fira Sans", Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #d7dde3; stroke-width: 1.5; filter: url(#shadow); }
      .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; filter: url(#shadow); }
      .diamond { fill: #f1f7f4; stroke: #0f172a; stroke-width: 2; filter: url(#shadow); }
      .line { stroke: #0f172a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #0f766e; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="900" fill="url(#grid)" />
  <circle cx="1020" cy="150" r="150" fill="#eef6f5" opacity="0.9" />
  <circle cx="190" cy="640" r="190" fill="#f4ede2" opacity="0.9" />
  <circle cx="1050" cy="700" r="110" fill="#edf6f1" opacity="0.9" />

  <text x="600" y="64" text-anchor="middle" class="title">Normal workflow: ralph-codex</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">Plan, run, review, refine</text>

  <circle cx="600" cy="130" r="30" class="node" />
  <text x="600" y="130" text-anchor="middle" class="label" dy="0.35em">Start</text>

  <rect x="350" y="180" width="500" height="80" rx="18" ry="18" class="card" />
  <text x="600" y="212" text-anchor="middle" class="label">init (one time)</text>
  <text x="600" y="236" text-anchor="middle" class="small">Create ralph.config.yml and .ralph/ state</text>

  <rect x="350" y="290" width="500" height="80" rx="18" ry="18" class="card" />
  <text x="600" y="322" text-anchor="middle" class="label">plan</text>
  <text x="600" y="346" text-anchor="middle" class="small">Generate tasks.md and success criteria</text>

  <rect x="350" y="400" width="500" height="80" rx="18" ry="18" class="card" />
  <text x="600" y="432" text-anchor="middle" class="label">run</text>
  <text x="600" y="456" text-anchor="middle" class="small">Execute the loop until tasks complete</text>

  <rect x="350" y="510" width="500" height="80" rx="18" ry="18" class="card" />
  <text x="600" y="542" text-anchor="middle" class="label">view</text>
  <text x="600" y="566" text-anchor="middle" class="small">Inspect tasks, criteria, and config</text>

  <polygon points="600,610 730,685 600,760 470,685" class="diamond" />
  <text x="600" y="674" text-anchor="middle" class="label">Feedback or</text>
  <text x="600" y="696" text-anchor="middle" class="label">changes?</text>

  <rect x="820" y="645" width="260" height="80" rx="18" ry="18" class="card" />
  <text x="950" y="677" text-anchor="middle" class="label">revise</text>
  <text x="950" y="701" text-anchor="middle" class="small">Add tasks from feedback</text>

  <circle cx="600" cy="810" r="32" class="node" />
  <text x="600" y="810" text-anchor="middle" class="label" dy="0.35em">Done</text>

  <line x1="600" y1="160" x2="600" y2="180" class="line" />
  <line x1="600" y1="260" x2="600" y2="290" class="line" />
  <line x1="600" y1="370" x2="600" y2="400" class="line" />
  <line x1="600" y1="480" x2="600" y2="510" class="line" />
  <line x1="600" y1="590" x2="600" y2="610" class="line" />
  <line x1="600" y1="760" x2="600" y2="778" class="line" />
  <text x="580" y="770" text-anchor="end" class="small">No</text>

  <line x1="730" y1="685" x2="820" y2="685" class="line" />
  <text x="775" y="665" text-anchor="middle" class="small">Yes</text>

  <path d="M 1080 685 C 1120 560 1100 360 850 440" class="loop" marker-end="url(#arrow-accent)" />
  <text x="1010" y="540" text-anchor="middle" class="small">Loop to run</text>
</svg>
